[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["artifacts*", "docs*", "scripts*", "tests*"]
namespaces = false

[project]
name = "ai-sales-crm-assistant"
version = "0.1.0"
description = "AI-assisted automotive lead workflow for HubSpot CRM and Google Sheets"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "email-validator>=2.2,<3",
  "httpx>=0.28,<1",
  "openai>=3.14,<4",
  "google-auth[requests]>=2.37,<3",
  "python-dotenv>=1.0,<2",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "coverage>=7.6,<8", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires explicitly configured external test accounts"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
